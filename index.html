<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DIG.MON — Inicio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .arcade-box { box-shadow: 5px 5px 0px #1A1600; }
    .arcade-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #1A1600; }
  </style>
</head>
<body class="bg-[#FFD400] text-[#1A1600] min-h-screen flex items-center justify-center p-4 font-sans">
  <div class="w-full max-w-md bg-[#FFF0C6] border-4 border-[#1A1600] rounded arcade-box p-6 flex flex-col gap-4 text-center">
    <span class="font-mono text-xs font-bold uppercase bg-[#FFE177] px-2 py-1 border-2 border-[#1A1600] self-center">DIG.MON ARCADE</span>
    <h1 class="text-3xl font-black uppercase tracking-wider">DIG.MON</h1>
    <p class="text-sm font-bold">Tai &amp; Gabumon · Inicio</p>

    <form id="form-inicio" class="flex flex-col gap-3 text-left">
      <div>
        <label class="block font-mono text-xs font-bold uppercase mb-1">Usuario</label>
        <input id="usuario" type="text" placeholder="Tai_01" class="w-full px-3 py-2 bg-white border-4 border-[#1A1600] rounded font-mono text-sm" />
      </div>
      <div>
        <label class="block font-mono text-xs font-bold uppercase mb-1">Contraseña</label>
        <input id="clave" type="password" placeholder="••••" class="w-full px-3 py-2 bg-white border-4 border-[#1A1600] rounded font-mono text-sm" />
      </div>
      <button type="submit" class="arcade-btn w-full py-3 bg-[#005CBA] text-white font-black uppercase tracking-wider border-4 border-[#1A1600] rounded arcade-box cursor-pointer mt-1">
        ENTRAR
      </button>
    </form>

    <a href="ninos.html" class="arcade-btn w-full py-2 bg-[#FFE177] text-[#1A1600] font-mono text-xs font-bold uppercase border-2 border-[#1A1600] rounded">
      IR A NINOS.HTML DIRECTO &rarr;
    </a>
  </div>

  <script>
    document.getElementById("form-inicio").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.getElementById("usuario").value.trim() || "Tai";
      try { localStorage.setItem("digimon_usuario", u); } catch (err) {}
      window.location.href = "ninos.html";
    });
  </script>
</body>
</html>
